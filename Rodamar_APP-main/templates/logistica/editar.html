{% extends 'base.html' %}

{% block title %}Editar {{ titulo }} | Rodamar Logística{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-bottom p-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square text-primary me-2"></i>Editar {{ titulo }}</h4>
            <small class="text-muted">{{ objeto }}</small>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="card-body p-4 row g-3">
                {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
            <div class="card-footer bg-white border-top p-3 d-flex justify-content-end gap-2">
                <a href="{% url destino %}" class="btn btn-light border">Cancelar</a>
                <button type="submit" class="btn btn-rodamar">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
<script>
    document.querySelectorAll('form input, form select').forEach(el => {
        if (el.type !== 'hidden') el.classList.add('form-control', 'bg-light');
    });
</script>
{% endblock %}
